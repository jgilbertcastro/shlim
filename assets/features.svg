<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 416" width="1000" height="416" role="img" aria-label="shlim features">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#151a38"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<linearGradient id="ac2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<radialGradient id="gv"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".55"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient><radialGradient id="gc"><stop offset="0" stop-color="#22d3ee" stop-opacity=".45"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>

</defs><rect width="1000" height="416" rx="24" fill="url(#bg)"/><g><rect x="24" y="24" width="300" height="172" rx="18" fill="#0f1530"/></g><rect x="24.75" y="24.75" width="298.5" height="170.5" rx="17.5" fill="none" stroke="#8b5cf6" stroke-opacity=".45" stroke-width="1.5"/><rect x="46" y="46" width="40" height="6" rx="3" fill="#8b5cf6"/><text x="46" y="86" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#f1f5f9">Persistent sessions</text><text x="46" y="118" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#94a3b8">Dev servers, REPLs, ssh and</text><text x="46" y="141" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#94a3b8">watchers outlive the tool call,</text><text x="46" y="164" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#94a3b8">even across different agents.</text><g><rect x="348" y="24" width="300" height="172" rx="18" fill="#0f1530"/></g><rect x="348.75" y="24.75" width="298.5" height="170.5" rx="17.5" fill="none" stroke="#22d3ee" stroke-opacity=".45" stroke-width="1.5"/><rect x="370" y="46" width="40" height="6" rx="3" fill="#22d3ee"/><text x="370" y="86" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#f1f5f9">Output that fits a thought</text><text x="370" y="118" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#94a3b8">ANSI stripped, progress collapsed,</text><text x="370" y="141" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#94a3b8">repeats folded to (×50), long</text><text x="370" y="164" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#94a3b8">output cut to head + tail.</text><g><rect x="672" y="24" width="300" height="172" rx="18" fill="#0f1530"/></g><rect x="672.75" y="24.75" width="298.5" height="170.5" rx="17.5" fill="none" stroke="#34d399" stroke-opacity=".45" stroke-width="1.5"/><rect x="694" y="46" width="40" height="6" rx="3" fill="#34d399"/><text x="694" y="86" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#f1f5f9">Waits that are smart</text><text x="694" y="118" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#94a3b8">Returns on exit, silence or an</text><text x="694" y="141" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#94a3b8">input prompt: Password:, [y/N],</text><text x="694" y="164" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#94a3b8">&gt;&gt;&gt;. No polling.</text><g><rect x="24" y="220" width="300" height="172" rx="18" fill="#0f1530"/></g><rect x="24.75" y="220.75" width="298.5" height="170.5" rx="17.5" fill="none" stroke="#f472b6" stroke-opacity=".45" stroke-width="1.5"/><rect x="46" y="242" width="40" height="6" rx="3" fill="#f472b6"/><text x="46" y="282" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#f1f5f9">Full-screen apps</text><text x="46" y="314" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#94a3b8">vim, htop and less come back as</text><text x="46" y="337" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#94a3b8">the rendered screen, not escape</text><text x="46" y="360" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#94a3b8">codes.</text><g><rect x="348" y="220" width="300" height="172" rx="18" fill="#0f1530"/></g><rect x="348.75" y="220.75" width="298.5" height="170.5" rx="17.5" fill="none" stroke="#fbbf24" stroke-opacity=".45" stroke-width="1.5"/><rect x="370" y="242" width="40" height="6" rx="3" fill="#fbbf24"/><text x="370" y="282" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#f1f5f9">Per-tool filters</text><text x="370" y="314" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#94a3b8">dotnet, npm/pnpm, docker, git,</text><text x="370" y="337" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#94a3b8">cargo lose routine chatter. Errors</text><text x="370" y="360" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#94a3b8">always stay.</text><g><rect x="672" y="220" width="300" height="172" rx="18" fill="#0f1530"/></g><rect x="672.75" y="220.75" width="298.5" height="170.5" rx="17.5" fill="none" stroke="#60a5fa" stroke-opacity=".45" stroke-width="1.5"/><rect x="694" y="242" width="40" height="6" rx="3" fill="#60a5fa"/><text x="694" y="282" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#f1f5f9">Watch and take over</text><text x="694" y="314" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#94a3b8">shlim attach mirrors any session</text><text x="694" y="337" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#94a3b8">in your terminal. Ctrl+\ detaches.</text></svg>